      <stop offset="100%" stop-color="#260882" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="124" fill="url(#bg)" />

  <g>
    <!-- Energy ticks -->
    <rect x="162" y="28" width="32" height="76" rx="16" transform="rotate(22 178 66)" fill="#FFC928" />
    <rect x="198" y="68" width="28" height="54" rx="14" transform="rotate(50 212 95)" fill="#FFAF12" />

    <!-- 3D Sunset Rim -->
    <path d="M 235 446 C 285 456 345 448 395 420 C 438 396 468 354 472 305 C 476 255 464 205 440 162 C 458 206 462 262 448 312 C 428 382 358 438 275 445 C 261 446 248 446 235 446 Z" fill="url(#rim)" />
    <path d="M 270 435 C 340 438 410 396 438 335 C 452 304 456 265 445 225 C 455 265 450 310 430 348 C 395 410 330 440 270 435 Z" fill="#FF5538" opacity="0.85" />

    <!-- White 'b' -->
    <path d="M 112 40 C 142 40, 168 64, 168 96 L 168 185 C 198 152, 245 132, 298 132 C 392 132, 458 204, 458 300 C 458 396, 386 464, 286 464 C 214 464, 168 428, 150 388 L 150 398 C 150 422, 134 438, 110 438 C 86 438, 68 422, 68 398 L 68 96 C 68 64, 86 40, 112 40 Z" fill="#FFFFFF" />

