<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C31FF" />
      <stop offset="40%" stop-color="#5420F5" />
      <stop offset="85%" stop-color="#370EB8" />
      <stop offset="100%" stop-color="#2A0894" />
